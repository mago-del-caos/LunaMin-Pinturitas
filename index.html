<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Luna Min - ¡Dibuja y Colorea!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --c-coral:#FF6B6B; --c-yellow:#FFD93D; --c-green:#6BCB77; --c-blue:#4D96FF;
  --c-pink:#FF6BCB; --c-purple:#9D4EDD; --c-orange:#FF9F1C; --c-teal:#2EC4B6;
  --ink:#5b2333;
}
*{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
  font-family:'Fredoka','Comic Sans MS',system-ui,sans-serif;
  background:linear-gradient(135deg,#FF9ACD 0%,#FFC2D1 50%,#FFE5EC 100%);
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; color:var(--ink); }

/* ===== Pantalla de inicio ===== */
.welcome-modal{ position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; padding-bottom:8vh; overflow:hidden; background:#FFC2D1; }
.welcome-modal.hidden{ display:none; }
.welcome-bg-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
.welcome-heart{ position:relative; z-index:2; font-size:150px; line-height:1; color:#FF4757; cursor:pointer;
  filter:drop-shadow(0 0 25px rgba(255,255,255,.85)); animation:heartbeat 1.2s infinite;
  display:flex; flex-direction:column; align-items:center; background:none; border:none; }
.welcome-heart:active{ transform:scale(.85); }
.welcome-heart .tap-text{ font-size:30px; font-weight:700; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.35); margin-top:-28px; }
@keyframes heartbeat{ 0%,100%{transform:scale(1)} 25%{transform:scale(1.12)} 45%{transform:scale(.97)} 60%{transform:scale(1.08)} }

/* ===== Estructura ===== */
.app-container{ display:flex; flex-direction:column; height:100dvh; max-width:980px; margin:0 auto; }
.app-header{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:4px 8px 0; }
.banner-img{ height:52px; max-width:92%; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.15)); }

.palette-container{ flex:0 0 auto; padding:6px 8px 2px; }
.color-row{ display:flex; gap:7px; overflow-x:auto; padding:4px 2px; scrollbar-width:none; }
.color-row::-webkit-scrollbar{ display:none; }
.color-btn{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:3px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer; transition:transform .1s; position:relative; }
.color-btn.active{ transform:scale(1.22); border-color:var(--ink); z-index:1; }
.color-btn.wheel{ display:flex; align-items:center; justify-content:center; font-size:19px;
  background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
.color-btn.wheel input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.sticker-row{ display:none; gap:7px; overflow-x:auto; padding:4px 2px; scrollbar-width:none; }
.sticker-row.show{ display:flex; }
.sticker-row::-webkit-scrollbar{ display:none; }
.sticker-btn{ flex:0 0 auto; width:44px; height:44px; border-radius:14px; border:3px solid #fff; background:#fff8;
  font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.18); }
.sticker-btn.active{ border-color:var(--ink); transform:scale(1.12); background:#fff; }

.toolbar-container{ flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; padding:6px 8px 2px; scrollbar-width:none; align-items:stretch; }
.toolbar-container::-webkit-scrollbar{ display:none; }
.tool-btn{ flex:0 0 auto; width:62px; padding:6px 2px 4px; border:3px solid #fff; border-radius:16px; background:#ffffffd9;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
.tool-btn .ic{ font-size:24px; line-height:1.1; }
.tool-btn .tool-name{ font-size:10.5px; font-weight:600; }
.tool-btn.active{ border-color:var(--ink); background:var(--c-yellow); transform:scale(1.05); }
.tool-btn.on{ background:var(--c-teal); border-color:var(--ink); color:#fff; }
.size-control{ flex:0 0 auto; display:flex; align-items:center; gap:7px; background:#ffffffd9; border:3px solid #fff;
  border-radius:16px; padding:4px 10px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
.size-preview{ border-radius:50%; background:#FF0000; border:2px solid #0003; flex:0 0 auto; }
.size-slider{ width:92px; accent-color:var(--c-coral); }
.size-dots{ display:flex; gap:5px; }
.size-dot{ width:30px; height:30px; border-radius:50%; border:2px solid #0002; background:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; }
.size-dot i{ display:block; border-radius:50%; background:var(--ink); }
.size-dot.active{ border-color:var(--ink); background:var(--c-yellow); }

/* ===== Lienzo por capas ===== */
.canvas-container{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:6px 10px; min-height:0; }
.canvas-stack{ position:relative; width:100%; max-width:900px; aspect-ratio:3/2; max-height:100%;
  border-radius:18px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.28); background:#fff; touch-action:none; }
.canvas-stack canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#layerDraw{ cursor:crosshair; }

/* ===== Acciones ===== */
.action-bar{ flex:0 0 auto; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:4px 8px; }
.main-btn,.main-btn-text{ border:3px solid #fff; border-radius:999px; cursor:pointer; font-family:inherit;
  box-shadow:0 3px 8px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; gap:5px; font-weight:700; color:#fff; }
.main-btn{ width:48px; height:48px; font-size:21px; }
.main-btn-text{ height:48px; padding:0 15px; font-size:15px; }
.main-btn:active,.main-btn-text:active{ transform:scale(.92); }
.main-btn:disabled{ opacity:.35; }
.btn-undo{ background:var(--c-blue); } .btn-redo{ background:#7FB3FF; }
.btn-new{ background:var(--c-coral); } .btn-new.confirm{ background:#d90429; animation:heartbeat .7s infinite; }
.btn-upload{ background:var(--c-purple); } .btn-save{ background:var(--c-green); }
.btn-gallery{ background:var(--c-orange); }
.btn-fireworks{ background:#FF9F1C; } .btn-balloons{ background:var(--c-pink); }
.btn-bg{ background:var(--c-teal); }

/* ===== Plantillas ===== */
.gallery-bar{ flex:0 0 auto; padding:2px 8px 8px; }
.gallery-bar.hidden{ display:none; }
.category-tabs{ display:flex; gap:6px; justify-content:center; margin-bottom:5px; }
.category-tab{ width:44px; height:38px; font-size:20px; border-radius:12px; border:3px solid #fff; background:#ffffffc9; cursor:pointer; }
.category-tab.active{ background:var(--c-yellow); border-color:var(--ink); }
.templates-scroll{ display:flex; gap:8px; overflow-x:auto; padding:2px; scrollbar-width:none; }
.templates-scroll::-webkit-scrollbar{ display:none; }
.template-card{ flex:0 0 auto; width:74px; height:56px; background:#fff; border:3px solid #fff; border-radius:12px;
  cursor:pointer; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.18); padding:3px; }
.template-card svg{ width:100%; height:100%; }
.template-card.active{ border-color:var(--ink); background:#FFF3B0; }
.template-card.none{ display:flex; align-items:center; justify-content:center; font-size:24px; }

/* ===== Modal galería / fondos ===== */
.modal{ position:fixed; inset:0; z-index:5000; background:rgba(60,10,40,.55); display:none; align-items:center; justify-content:center; padding:14px; }
.modal.show{ display:flex; }
.modal-box{ background:#FFF7FB; border-radius:22px; max-width:560px; width:100%; max-height:86dvh; overflow:auto; padding:16px; }
.modal-box h3{ text-align:center; font-size:21px; margin-bottom:10px; }
.gal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.gal-item{ position:relative; border-radius:12px; overflow:hidden; border:3px solid #FFC2D1; cursor:pointer; background:#fff; }
.gal-item img{ width:100%; display:block; aspect-ratio:3/2; object-fit:cover; }
.gal-item .del{ position:absolute; top:3px; right:3px; width:26px; height:26px; border-radius:50%; border:none;
  background:#FF4757; color:#fff; font-size:14px; cursor:pointer; }
.gal-empty{ text-align:center; padding:18px 6px; font-size:16px; }
.bg-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.bg-opt{ height:52px; border-radius:12px; border:3px solid #FFC2D1; cursor:pointer; }
.bg-opt.active{ border-color:var(--ink); }
.modal-close{ display:block; margin:14px auto 0; background:var(--c-coral); color:#fff; border:none; border-radius:999px;
  padding:11px 26px; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; }

/* ===== Toast y efectos ===== */
.toast{ position:fixed; left:50%; bottom:110px; transform:translateX(-50%) scale(.8); background:#fff; color:var(--ink);
  font-weight:700; font-size:17px; padding:10px 20px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  opacity:0; pointer-events:none; transition:all .2s; z-index:6000; }
.toast.show{ opacity:1; transform:translateX(-50%) scale(1); }
.effects-layer{ position:fixed; inset:0; pointer-events:none; z-index:9000; overflow:hidden; }
.firework-particle{ position:absolute; width:9px; height:9px; border-radius:50%; animation:burst 1s ease-out forwards; }
@keyframes burst{ to{ transform:translate(var(--tx),var(--ty)) scale(.2); opacity:0; } }
.balloon{ position:absolute; bottom:-90px; width:44px; height:56px; border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
  animation:floatUp linear forwards; opacity:.92; }
.balloon::after{ content:""; position:absolute; left:50%; top:100%; width:2px; height:34px; background:#0004; }
@keyframes floatUp{ to{ transform:translateY(-115vh) rotate(6deg); } }
body:fullscreen { overflow:auto; }
body:fullscreen header, body:fullscreen .min-banner { display:none; }
body:fullscreen .container { padding:6px; max-width:none; }
body:fullscreen .canvas-container { max-width:min(99vw, calc((100dvh - 215px) * 1.5)); }
body:fullscreen .toolbar { padding:7px; margin-bottom:7px; }
</style>
</head>
<body>

<!-- Pantalla de Inicio (Imagen + Corazón Palpitante) -->
<div id="welcomeModal" class="welcome-modal">
  <img src="portada.png" alt="Portada" class="welcome-bg-img">
  <button class="welcome-heart" id="startBtn" aria-label="Empezar">
    <span>❤️</span>
    <span class="tap-text">¡Toca!</span>
  </button>
</div>

<div class="app-container">

  <!-- Banner -->
  <header class="app-header">
    <img src="Min.png" alt="Banner Luna Min" class="banner-img">
  </header>

  <!-- Colores y Pegatinas -->
  <div class="palette-container">
    <div id="colorGrid" class="color-row"></div>
    <div id="stickerGrid" class="sticker-row"></div>
  </div>

  <!-- Herramientas -->
  <div class="toolbar-container" id="toolbar">
    <button class="tool-btn" data-tool="pencil" data-name="Lápiz"><span class="ic">✏️</span><span class="tool-name">Lápiz</span></button>
    <button class="tool-btn active" data-tool="brush" data-name="Pincel"><span class="ic">🖌️</span><span class="tool-name">Pincel</span></button>
    <button class="tool-btn" data-tool="marker" data-name="Marcador"><span class="ic">🖍️</span><span class="tool-name">Marcador</span></button>
    <button class="tool-btn" data-tool="crayon" data-name="Crayón"><span class="ic">🖍️</span><span class="tool-name">Crayón</span></button>
    <button class="tool-btn" data-tool="spray" data-name="Spray"><span class="ic">💨</span><span class="tool-name">Spray</span></button>
    <button class="tool-btn" data-tool="rainbow" data-name="Arcoíris"><span class="ic">🌈</span><span class="tool-name">Arcoíris</span></button>
    <button class="tool-btn" data-tool="glitter" data-name="Brillos"><span class="ic">✨</span><span class="tool-name">Brillos</span></button>
    <button class="tool-btn" data-tool="bucket" data-name="Cubo de pintura"><span class="ic">🪣</span><span class="tool-name">Cubo</span></button>
    <button class="tool-btn" data-tool="shape" data-name="Formas"><span class="ic">⭐</span><span class="tool-name">Formas</span></button>
    <button class="tool-btn" data-tool="sticker" data-name="Pegatinas"><span class="ic">😊</span><span class="tool-name">Pegatinas</span></button>
    <button class="tool-btn" data-tool="eraser" data-name="Borrador"><span class="ic">🧽</span><span class="tool-name">Borrar</span></button>
    <button class="tool-btn" id="mirrorBtn" data-name="Espejo mágico"><span class="ic">🪞</span><span class="tool-name">Espejo</span></button>
    <div class="size-control">
      <div id="sizePreview" class="size-preview"></div>
      <input type="range" id="sizeSlider" class="size-slider" min="4" max="90" value="15">
      <div class="size-dots">
        <button class="size-dot" data-size="8"><i style="width:6px;height:6px"></i></button>
        <button class="size-dot active" data-size="18"><i style="width:11px;height:11px"></i></button>
        <button class="size-dot" data-size="36"><i style="width:18px;height:18px"></i></button>
      </div>
    </div>
  </div>

  <!-- Lienzo por capas: fondo / rellenos / líneas / dibujo -->
  <div class="canvas-container">
    <div class="canvas-stack" id="canvasStack">
      <canvas id="layerBase" width="1200" height="800"></canvas>
      <canvas id="layerFill" width="1200" height="800"></canvas>
      <canvas id="layerLine" width="1200" height="800"></canvas>
      <canvas id="layerDraw" width="1200" height="800"></canvas>
    </div>
  </div>

  <!-- Botones de Acción -->
  <div class="action-bar">
    <button id="undoBtn" class="main-btn btn-undo" title="Deshacer">↩️</button>
    <button id="redoBtn" class="main-btn btn-redo" title="Rehacer">↪️</button>
    <button id="newCanvasBtn" class="main-btn btn-new" title="Dibujo nuevo">🗑️</button>
    <button id="uploadBtn" class="main-btn-text btn-upload"><span>📷</span><span>Subir</span></button>
    <input type="file" id="imageLoader" accept="image/png, image/jpeg" style="display:none">
    <button id="bgBtn" class="main-btn btn-bg" title="Color del papel">🎨</button>
    <button id="galleryBtn" class="main-btn-text btn-gallery"><span>🖼️</span><span>Mis dibujos</span></button>
    <button id="downloadBtn" class="main-btn-text btn-save"><span>⬇️</span><span>Guardar</span></button>
    <button id="fireworksBtn" class="main-btn btn-fireworks" title="Fuegos artificiales">🎆</button>
    <button id="balloonsBtn" class="main-btn btn-balloons" title="Globos">🎈</button>
    <button id="templatesToggle" class="main-btn btn-bg" title="Plantillas para colorear">📚</button>
  </div>

  <!-- Galería de plantillas -->
  <div class="gallery-bar" id="galleryBar">
    <div id="categoryTabs" class="category-tabs">
      <button class="category-tab active" data-cat="animales">🐾</button>
      <button class="category-tab" data-cat="naturaleza">🌳</button>
      <button class="category-tab" data-cat="vehiculos">🚗</button>
      <button class="category-tab" data-cat="cosas">🧸</button>
      <button class="category-tab" data-cat="comida">🍕</button>
    </div>
    <div id="templatesGrid" class="templates-scroll"></div>
  </div>
</div>

<!-- Modal: Mis dibujos -->
<div id="galleryModal" class="modal">
  <div class="modal-box">
    <h3>🖼️ Mis dibujos</h3>
    <div id="galGrid" class="gal-grid"></div>
    <div id="galEmpty" class="gal-empty">Todavía no guardas dibujos aquí.<br>Pulsa «Guardar» y luego «Guardar también en Mis dibujos».</div>
    <button class="modal-close" data-close="galleryModal">Cerrar</button>
  </div>
</div>

<!-- Modal: color del papel -->
<div id="bgModal" class="modal">
  <div class="modal-box">
    <h3>🎨 Color del papel</h3>
    <div id="bgGrid" class="bg-grid"></div>
    <button class="modal-close" data-close="bgModal">Cerrar</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="effectsLayer" class="effects-layer"></div>

<script>
"use strict";
/* ============================================================
   LUNA MIN — ¡Dibuja y Colorea! (versión mejorada)
   Lienzo por capas, como las apps de dibujo de verdad:
   fondo (papel o foto) · rellenos del cubo · líneas de la
   plantilla · dibujo libre encima. El borrador solo borra el
   dibujo libre: las líneas y el color nunca se estropean.
   ============================================================ */
const W = 1200, H = 800;
const cvBase = document.getElementById('layerBase'),  bx = cvBase.getContext('2d');
const cvFill = document.getElementById('layerFill'),  fx = cvFill.getContext('2d');
const cvLine = document.getElementById('layerLine'),  lx = cvLine.getContext('2d');
const cvDraw = document.getElementById('layerDraw'),  dx = cvDraw.getContext('2d', { willReadFrequently:true });
[bx,fx,lx,dx].forEach(c => { c.lineCap = 'round'; c.lineJoin = 'round'; });

let currentTool = 'brush';
let currentColor = '#FF0000';
let brushSize = 15;
let currentSticker = '⭐';
let currentShape = 'star';
let mirror = false;
let isDrawing = false;
let lastX = 0, lastY = 0, midX = 0, midY = 0;
let shapeStart = null, shapeSnapshot = null;
let hue = 0;
let currentTemplate = null;
let currentCategory = 'animales';
let bgColor = '#FFFFFF';
let undoStack = [], redoStack = [];
const MAX_UNDO = 30;

/* ============ SONIDOS Y VOZ (español latino) ============ */
let audioCtx = null;
function playSound(freq = 800, duration = 0.1){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + duration);
  }catch(e){}
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-MX'; u.rate = 1.05; u.pitch = 1.5;
    const vs = window.speechSynthesis.getVoices().filter(v => /^es[-_]MX/i.test(v.lang));
    if(vs.length) u.voice = vs[0];
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ COLORES Y PEGATINAS ============ */
const colors = [
  ['#FF0000','rojo'],['#FF8000','naranja'],['#FFFF00','amarillo'],['#7ED321','verde claro'],
  ['#00B050','verde'],['#00FFFF','celeste'],['#0000FF','azul'],['#8000FF','morado'],
  ['#FF00FF','magenta'],['#FF6BCB','rosa'],['#8B4513','café'],['#FFFFFF','blanco'],
  ['#A0A0A0','gris'],['#000000','negro'],['#FF6B6B','coral'],['#FFD93D','dorado'],
  ['#6BCB77','verde menta'],['#4D96FF','azul cielo'],['#FFD9B3','piel'],['#9D4EDD','violeta']
];
const stickers = ['⭐','❤️','😊','🌸','🎈','👑','🌈','🦋','🐶','🐱','🍓','🍦','🚀','🌙','🎁','🐢','🦄','🍩','⚽','🐠'];
const colorGrid = document.getElementById('colorGrid');
colors.forEach(([hex, name], i) => {
  const b = document.createElement('div');
  b.className = 'color-btn' + (i === 0 ? ' active' : '');
  b.style.background = hex; b.title = name;
  b.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); currentColor = hex;
    document.getElementById('sizePreview').style.background = hex;
    if(currentTool === 'sticker') selectTool('brush');
    playSound(600, .05); speak(name);
  });
  colorGrid.appendChild(b);
});
const wheel = document.createElement('div');
wheel.className = 'color-btn wheel'; wheel.title = 'Más colores';
wheel.innerHTML = '🎨<input type="color" id="colorWheel" value="#FF0000">';
colorGrid.appendChild(wheel);
wheel.querySelector('input').addEventListener('input', e => {
  currentColor = e.target.value;
  document.getElementById('sizePreview').style.background = currentColor;
  document.querySelectorAll('.color-btn').forEach(x => x.classList.remove('active'));
  wheel.classList.add('active');
  if(currentTool === 'sticker') selectTool('brush');
});
const stickerGrid = document.getElementById('stickerGrid');
stickers.forEach((st, i) => {
  const b = document.createElement('div');
  b.className = 'sticker-btn' + (i === 0 ? ' active' : '');
  b.textContent = st;
  b.addEventListener('click', () => {
    document.querySelectorAll('.sticker-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); currentSticker = st; selectTool('sticker'); playSound(1200, .05);
  });
  stickerGrid.appendChild(b);
});

/* ============ HERRAMIENTAS ============ */
function selectTool(tool){
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  stickerGrid.classList.toggle('show', tool === 'sticker');
  if(tool === 'shape') cycleShapeTip();
}
document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
  b.addEventListener('click', () => {
    if(b.dataset.tool === 'shape' && currentTool === 'shape'){ nextShape(); return; }
    selectTool(b.dataset.tool);
    playSound(700, .06);
    if(b.dataset.name) speak(b.dataset.name);
  });
});
const SHAPES = [['star','⭐ Estrella'],['heart','❤️ Corazón'],['circle','⭕ Círculo'],['square','⬛ Cuadrado'],['line','〰️ Línea']];
function cycleShapeTip(){ const s = SHAPES.find(x => x[0] === currentShape); showToast('Forma: ' + s[1]); }
function nextShape(){

/* ============ ESTADO: DESHACER / REHACER / AUTOGUARDADO ============ */
function snap(){ return { f: cvFill.toDataURL(), d: cvDraw.toDataURL() }; }
function restore(s){
  const i1 = new Image(), i2 = new Image(); let n = 0;
  const done = () => { if(++n === 2) refreshUndoBtns(); };
  i1.onload = () => { fx.clearRect(0,0,W,H); fx.drawImage(i1,0,0); done(); };
  i2.onload = () => { dx.clearRect(0,0,W,H); dx.drawImage(i2,0,0); done(); };
  i1.src = s.f; i2.src = s.d;
}
function saveState(){
  undoStack.push(snap()); if(undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = []; refreshUndoBtns(); autosave();
}
function refreshUndoBtns(){
  document.getElementById('undoBtn').disabled = undoStack.length <= 1;
  document.getElementById('redoBtn').disabled = !redoStack.length;
}
document.getElementById('undoBtn').addEventListener('click', () => {
  if(undoStack.length <= 1) return;
  redoStack.push(undoStack.pop());
  restore(undoStack[undoStack.length - 1]); playSound(400, .1); autosave();
});
document.getElementById('redoBtn').addEventListener('click', () => {
  if(!redoStack.length) return;
  const s = redoStack.pop(); undoStack.push(s);
  restore(s); playSound(500, .1); autosave();
});
function autosave(){
  try{
    localStorage.setItem('lunamin_actual', JSON.stringify({
      f: cvFill.toDataURL('image/jpeg', .82), d: cvDraw.toDataURL(),
      line: currentTemplate, bg: bgColor
    }));
  }catch(e){}
}

/* ============ DIBUJO ============ */
function getPos(e){
  const r = cvDraw.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function mirrorX(x){ return W - x; }
function strokeStyleFor(tool){
  if(tool === 'eraser') return null;
  if(tool === 'rainbow') return 'hsl(' + (hue % 360) + ',95%,55%)';
  return currentColor;
}
function drawSegment(x1, y1, x2, y2, tool){
  const wdt = tool === 'pencil' ? Math.max(2, brushSize * .35)
            : tool === 'marker' ? brushSize * 1.5
            : tool === 'crayon' ? brushSize * 1.15
            : brushSize;
  dx.save();
  if(tool === 'eraser'){
    dx.globalCompositeOperation = 'destination-out';
    dx.strokeStyle = 'rgba(0,0,0,1)'; dx.globalAlpha = 1;
  } else if(tool === 'marker'){
    dx.globalAlpha = .32; dx.strokeStyle = currentColor;
  } else if(tool === 'glitter'){
    dx.globalAlpha = .5; dx.strokeStyle = currentColor;
  } else {
    dx.globalAlpha = 1; dx.strokeStyle = strokeStyleFor(tool);
  }
  dx.lineWidth = wdt;
  dx.beginPath(); dx.moveTo(x1, y1); dx.lineTo(x2, y2); dx.stroke();
  if(tool === 'crayon'){
    dx.globalAlpha = .25;
    for(let i = 0; i < 3; i++){
      dx.beginPath();
      dx.moveTo(x1 + (Math.random() - .5) * wdt * .7, y1 + (Math.random() - .5) * wdt * .7);
      dx.lineTo(x2 + (Math.random() - .5) * wdt * .7, y2 + (Math.random() - .5) * wdt * .7);
      dx.stroke();
    }
    dx.globalAlpha = 1;
  }
  if(tool === 'glitter'){
    dx.globalAlpha = 1; dx.fillStyle = '#FFF6A5';
    const n = Math.floor(Math.hypot(x2 - x1, y2 - y1) / 14);
    for(let i = 0; i < n; i++){
      const gx = x2 + (Math.random() - .5) * brushSize * 1.6, gy = y2 + (Math.random() - .5) * brushSize * 1.6;
      const s = 3 + Math.random() * 5;
      dx.beginPath();
      dx.moveTo(gx, gy - s); dx.lineTo(gx + s * .3, gy - s * .3); dx.lineTo(gx + s, gy); dx.lineTo(gx + s * .3, gy + s * .3);
      dx.lineTo(gx, gy + s); dx.lineTo(gx - s * .3, gy + s * .3); dx.lineTo(gx - s, gy); dx.lineTo(gx - s * .3, gy - s * .3);
      dx.closePath(); dx.fill();
    }
  }
  dx.restore();
}
function sprayAt(x, y){
  dx.save(); dx.fillStyle = strokeStyleFor('brush');
  const r = brushSize * 1.15, n = 22;
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r;
    dx.globalAlpha = .5 + Math.random() * .5;
    dx.beginPath(); dx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 1 + Math.random() * 2.2, 0, Math.PI * 2); dx.fill();
  }
  dx.restore();
}
function stampSticker(x, y){
  dx.save();
  dx.font = (brushSize * 3) + 'px Arial'; dx.textAlign = 'center'; dx.textBaseline = 'middle';
  dx.translate(x, y); dx.rotate((Math.random() - .5) * .35);
  dx.fillText(currentSticker, 0, 0);
  dx.restore();
}
function drawShape(x1, y1, x2, y2, tool){
  dx.save();
  dx.strokeStyle = currentColor; dx.fillStyle = currentColor;
  dx.lineWidth = Math.max(3, brushSize * .45);
  const w = x2 - x1, h = y2 - y1;
  if(currentShape === 'line'){ dx.beginPath(); dx.moveTo(x1, y1); dx.lineTo(x2, y2); dx.stroke(); }
  else if(currentShape === 'circle'){ dx.beginPath(); dx.ellipse(x1 + w/2, y1 + h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI * 2); dx.globalAlpha = .85; dx.fill(); }
  else if(currentShape === 'square'){ dx.globalAlpha = .85; dx.fillRect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(w), Math.abs(h)); }
  else if(currentShape === 'star' || currentShape === 'heart'){
    const cx = x1 + w/2, cy = y1 + h/2, R = Math.max(Math.abs(w), Math.abs(h)) / 2 || 10;
    dx.beginPath();
    if(currentShape === 'star'){
      for(let i = 0; i < 10; i++){
        const r = i % 2 ? R * .45 : R, a = -Math.PI/2 + i * Math.PI / 5;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        i ? dx.lineTo(px, py) : dx.moveTo(px, py);
      }
    } else {
      dx.moveTo(cx, cy + R * .85);
      dx.bezierCurveTo(cx - R * 1.25, cy + R * .1, cx - R * .8, cy - R, cx, cy - R * .3);
      dx.bezierCurveTo(cx + R * .8, cy - R, cx + R * 1.25, cy + R * .1, cx, cy + R * .85);
    }
    dx.closePath(); dx.globalAlpha = .9; dx.fill();
  }
  dx.restore();
}

cvDraw.addEventListener('pointerdown', e => {
  e.preventDefault();
  cvDraw.setPointerCapture(e.pointerId);
  const p = getPos(e);
  if(currentTool === 'bucket'){ floodFill(Math.floor(p.x), Math.floor(p.y), currentColor); saveState(); playSound(300, .2); return; }
  if(currentTool === 'sticker'){
    stampSticker(p.x, p.y);
    if(mirror) stampSticker(mirrorX(p.x), p.y);
    saveState(); playSound(1000, .1); return;
  }
  if(currentTool === 'shape'){
    shapeStart = p; shapeSnapshot = cvDraw.toDataURL(); isDrawing = true; return;
  }
  isDrawing = true; lastX = midX = p.x; lastY = midY = p.y;
  if(currentTool === 'spray'){ sprayAt(p.x, p.y); if(mirror) sprayAt(mirrorX(p.x), p.y); return; }
  drawSegment(p.x, p.y, p.x + .01, p.y + .01, currentTool);
  if(mirror) drawSegment(mirrorX(p.x), p.y, mirrorX(p.x) + .01, p.y + .01, currentTool);
});
cvDraw.addEventListener('pointermove', e => {
  if(!isDrawing) return;
  e.preventDefault();
  const p = getPos(e);
  if(currentTool === 'shape'){
    const img = new Image();
    img.onload = () => {
      dx.clearRect(0, 0, W, H); dx.drawImage(img, 0, 0);
      drawShape(shapeStart.x, shapeStart.y, p.x, p.y);
      if(mirror) drawShape(mirrorX(shapeStart.x), shapeStart.y, mirrorX(p.x), p.y);
    };
    img.src = shapeSnapshot; return;
  }
  if(currentTool === 'spray'){ sprayAt(p.x, p.y); if(mirror) sprayAt(mirrorX(p.x), p.y); lastX = p.x; lastY = p.y; return; }
  hue += Math.hypot(p.x - lastX, p.y - lastY) * .6;
  const nx = (midX + p.x) / 2, ny = (midY + p.y) / 2;
  dx.beginPath();
  drawSegment(midX, midY, nx, ny, currentTool);
  if(mirror) drawSegment(mirrorX(midX), midY, mirrorX(nx), ny, currentTool);
  lastX = p.x; lastY = p.y; midX = nx; midY = ny;
});
function endStroke(){
  if(!isDrawing) return;
  isDrawing = false; shapeStart = null; shapeSnapshot = null;
  saveState();
}
cvDraw.addEventListener('pointerup', endStroke);
cvDraw.addEventListener('pointercancel', endStroke);

/* ============ CUBO DE PINTURA (rellena sin tapar las líneas) ============ */
function hexToRgba(hex){
  hex = hex.replace('#', '');
  if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16), 255];
}
function floodFill(startX, startY, fillHex){
  if(startX < 0 || startX >= W || startY < 0 || startY >= H) return;
  /* Fuente: fondo + rellenos + líneas (el dibujo libre no bloquea). */
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  const sx = src.getContext('2d');
  sx.drawImage(cvBase, 0, 0); sx.drawImage(cvFill, 0, 0); sx.drawImage(cvLine, 0, 0);
  const sData = sx.getImageData(0, 0, W, H).data;
  const fData = fx.getImageData(0, 0, W, H);
  const fd = fData.data;
  const fill = hexToRgba(fillHex);
  const sp = (startY * W + startX) * 4;
  const tr = sData[sp], tg = sData[sp+1], tb = sData[sp+2];
  const TOL = 48;
  const match = i => Math.abs(sData[i] - tr) + Math.abs(sData[i+1] - tg) + Math.abs(sData[i+2] - tb) < TOL;
  if(Math.abs(tr - fill[0]) + Math.abs(tg - fill[1]) + Math.abs(tb - fill[2]) < 12) return;
  const seen = new Uint8Array(W * H);
  const stack = [[startX, startY]];
  while(stack.length){
    let [x, y] = stack.pop();
    let i = y * W + x;
    while(x >= 0 && !seen[i] && match(i * 4)){ x--; i--; }
    x++; i++;
    let up = false, dn = false;
    while(x < W && !seen[i] && match(i * 4)){
      seen[i] = 1;
      const p = i * 4;
      fd[p] = fill[0]; fd[p+1] = fill[1]; fd[p+2] = fill[2]; fd[p+3] = 255;
      if(y > 0){ const a = match(p - W * 4) && !seen[i - W]; if(a && !up){ stack.push([x, y - 1]); up = true; } else if(!a) up = false; }
      if(y < H - 1){ const a = match(p + W * 4) && !seen[i + W]; if(a && !dn){ stack.push([x, y + 1]); dn = true; } else if(!a) dn = false; }
      x++; i++;
    }
  }
  fx.putImageData(fData, 0, 0);
}

function renderTemplates(){
  const grid = document.getElementById('templatesGrid');
  grid.innerHTML = '';
  const none = document.createElement('div');
  none.className = 'template-card none' + (!currentTemplate ? ' active' : '');
  none.textContent = '🚫'; none.title = 'Sin plantilla: papel libre';
  none.addEventListener('click', () => { clearTemplate(); });
  grid.appendChild(none);
  Object.entries(templates).forEach(([key, t]) => {
    if(t.cat !== currentCategory) return;
    const card = document.createElement('div');
    card.className = 'template-card' + (currentTemplate === key ? ' active' : '');
    card.innerHTML = t.svg;
    card.addEventListener('click', () => {
      document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active'); loadTemplate(key);
      speak(t.name); playSound(700, .1);
    });
    grid.appendChild(card);
  });
}
function templateLinesImage(svgText, cb){
  const blob = new Blob([svgText], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const ox = off.getContext('2d');
    ox.fillStyle = '#FFFFFF'; ox.fillRect(0, 0, W, H);
    ox.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    /* Blanco -> transparente: quedan solo las líneas y acentos de color. */
    const id = ox.getImageData(0, 0, W, H), d = id.data;
    for(let i = 0; i < d.length; i += 4){
      if(d[i] > 242 && d[i+1] > 242 && d[i+2] > 242) d[i+3] = 0;
    }
    ox.putImageData(id, 0, 0);
    cb(off);
  };
  img.src = url;
}
function loadTemplate(key){
  currentTemplate = key;
  templateLinesImage(templates[key].svg, off => {
    lx.clearRect(0, 0, W, H); lx.drawImage(off, 0, 0);
    fx.clearRect(0, 0, W, H); dx.clearRect(0, 0, W, H);
    undoStack = []; redoStack = []; saveState();
    showToast('🖍️ ¡A colorear!');
  });
}
function clearTemplate(){
  currentTemplate = null;
  lx.clearRect(0, 0, W, H);
  document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
  renderTemplates(); autosave(); playSound(500, .07);
}

document.getElementById('imageLoader').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      paintBase();
      const s = Math.min(W / img.width, H / img.height);
      const w = img.width * s, h = img.height * s;
      bx.drawImage(img, Math.floor((W - w) / 2), Math.floor((H - h) / 2), w, h);
      lx.clearRect(0,0,W,H); currentTemplate = null; renderTemplates();
      showToast('📷 ¡Foto lista para dibujar encima!'); autosave();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file); e.target.value = '';
});
function composite(){
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.drawImage(cvBase, 0, 0); o.drawImage(cvFill, 0, 0); o.drawImage(cvLine, 0, 0); o.drawImage(cvDraw, 0, 0);
  return out;
}

function createFirework(){
  const x = Math.random() * 100, y = Math.random() * 50 + 10;
  const cols = ['#FF0000','#FFD700','#00FF00','#00FFFF','#FF00FF','#FFA500'];
  const color = cols[Math.floor(Math.random() * cols.length)];
  for(let i = 0; i < 30; i++){
    const p = document.createElement('div');
    p.className = 'firework-particle';
    p.style.left = x + 'vw'; p.style.top = y + 'vh'; p.style.background = color;
    const a = Math.PI * 2 * i / 30, d = 80 + Math.random() * 50;
    p.style.setProperty('--tx', Math.cos(a) * d + 'px');
    p.style.setProperty('--ty', Math.sin(a) * d + 'px');
    effectsLayer.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function createBalloon(){
  const cols = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF6BCB','#9D4EDD','#FF9F1C'];
  const b = document.createElement('div');
  b.className = 'balloon';
  b.style.left = Math.random() * 90 + 'vw';
  b.style.background = cols[Math.floor(Math.random() * cols.length)];
  b.style.animationDuration = (4 + Math.random() * 3) + 's';
  effectsLayer.appendChild(b); setTimeout(() => b.remove(), 7000);
}
function launchConfetti(){
  for(let i = 0; i < 60; i++){
    setTimeout(() => {
      const c = document.createElement('div'); c.className = 'firework-particle';
      c.style.left = Math.random() * 100 + 'vw'; c.style.top = '100vh';
      c.style.background = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF'][i % 4];
      c.style.setProperty('--tx', '0px'); c.style.setProperty('--ty', '-110vh');
      c.style.animation = 'burst 2s linear forwards';
      effectsLayer.appendChild(c); setTimeout(() => c.remove(), 2000);
    }, i * 15);
  }
}

      id.onload = () => { dx.drawImage(id, 0, 0); undoStack = []; redoStack = []; saveState(); };
      id.src = saved.d;
      if(saved.f){
        const ifl = new Image();
        ifl.onload = () => fx.drawImage(ifl, 0, 0);
        ifl.src = saved.f;
      }
      if(saved.bg){ bgColor = saved.bg; paintBase(); }
      if(saved.line && templates[saved.line]){
        currentTemplate = saved.line;
        templateLinesImage(templates[saved.line].svg, off => { lx.drawImage(off, 0, 0); });
        renderTemplates();
      }
    } else {
      undoStack = []; saveState();
    }
  }catch(e){ undoStack = []; saveState(); }
  refreshUndoBtns();
}
function toggleFull(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
  else { document.body.requestFullscreen().catch(function(){}); speak('Pantalla completa'); }
}
init();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
